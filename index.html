<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    
    .game-title {
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(128, 233, 255, 0.5);
    }
    
    .game-title h1 {
      font-size: 48px;
      font-weight: bold;
      background: linear-gradient(90deg, #80e9ff, #4a90d9, #80e9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleGlow 3s ease-in-out infinite;
    }
    
    .game-title p {
      font-size: 16px;
      color: #80e9ff;
      margin-top: 10px;
      letter-spacing: 2px;
    }
    
    @keyframes titleGlow {
      0%, 100% {
        text-shadow: 0 0 20px rgba(128, 233, 255, 0.3);
      }
      50% {
        text-shadow: 0 0 30px rgba(128, 233, 255, 0.6);
      }
    }
    
    #game-container {
      border: 3px solid #4a90d9;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(74, 144, 217, 0.3),
                  inset 0 0 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    
    #game-container::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      background: linear-gradient(45deg, #4a90d9, #80e9ff, #4a90d9);
      border-radius: 8px;
      z-index: -1;
      opacity: 0.15;
    }
    
    .controls-hint {
      margin-top: 25px;
      text-align: center;
      color: #80e9ff;
      font-size: 14px;
      opacity: 0.8;
    }
    
    .controls-hint strong {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="game-title">
    <h1>SPACE SHOOTER</h1>
    <p>DEFEND THE GALAXY</p>
  </div>
  
  <div id="game-container"></div>
  
  <div class="controls-hint">
    <p><strong>Controls:</strong> Mouse to move • Click to shoot • WASD/Arrows + Space also work</p>
  </div>
  
  <script type="module" src="/main.js"></script>
</body>
</html>
